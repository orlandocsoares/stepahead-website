# =============================================================
# NGINX — Fase 1: apenas HTTP (antes de obter certificado SSL)
# Depois de correr certbot, substitui por nginx.ssl.conf
# =============================================================

# Limita pedidos ao endpoint de login (protecção força bruta)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name sabermais.edu.ao www.sabermais.edu.ao;

    # Endpoint usado pelo certbot para verificar o domínio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo o tráfego HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
