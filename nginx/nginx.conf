# =============================================================
# NGINX — Cloudflare Full (Strict)
# Certificado: Cloudflare Origin Certificate (nginx/ssl/)
# =============================================================

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# HTTP → redireciona para HTTPS
server {
    listen 80;
    server_name sabermais.edu.ao www.sabermais.edu.ao;
    return 301 https://$host$request_uri;
}

# HTTPS — servidor principal
server {
    listen 443 ssl;
    http2 on;
    server_name sabermais.edu.ao www.sabermais.edu.ao;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Sem limite prático — suporta uploads de vídeo e ficheiros grandes
    client_max_body_size 2G;
    # Timeouts alargados para uploads lentos (conexões móveis, ficheiros grandes)
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 60s;

    # Ficheiros estáticos — servidos directamente pelo NGINX
    location /storage/v1/object/public/nuvem-loop/ {
        alias "/app/storage/Nuvem LooP/";
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }
    location /storage/v1/object/public/logo-sabermais/ {
        alias "/app/storage/Logo Sabermais/";
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }
    location /storage/v1/object/public/logo-institutos/ {
        alias "/app/storage/Logo Institutos/";
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }
    location /storage/v1/object/public/ {
        alias /app/storage/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # Protecção força bruta no login
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://web:9002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Todos os pedidos → Next.js
    location / {
        proxy_pass http://web:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}