# =============================================================
# NGINX — Fase 2: HTTPS activo (após certbot emitir certificado)
# Substitui o conteúdo de nginx/nginx.conf por este ficheiro
# =============================================================

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# HTTP → redireciona sempre para HTTPS
server {
    listen 80;
    server_name sabermais.edu.ao www.sabermais.edu.ao;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — servidor principal
server {
    listen 443 ssl;
    http2 on;
    server_name sabermais.edu.ao www.sabermais.edu.ao;

    # Certificados emitidos pelo Certbot
    ssl_certificate     /etc/nginx/ssl/live/sabermais.edu.ao/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/sabermais.edu.ao/privkey.pem;

    # Configuração SSL segura (recomendada pela Mozilla)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Sem limite prático — suporta uploads de vídeo e ficheiros grandes
    client_max_body_size 2G;
    # Timeouts alargados para uploads lentos (conexões móveis, ficheiros grandes)
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 60s;

    # Protecção força bruta no login
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://web:9002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todos os outros pedidos → Next.js
    location / {
        proxy_pass http://web:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
