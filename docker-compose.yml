services:
  db:
    image: postgres:16
    container_name: sabermais-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sabermais
      POSTGRES_USER: sabermais
      POSTGRES_PASSWORD: sabermais
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sabermais-next
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "9002:9002"
    environment:
      DATABASE_URL: postgres://sabermais:sabermais@db:5432/sabermais
      NEXT_PUBLIC_APP_URL: http://localhost:9002
      SESSION_SECRET: local-dev-secret-change-me
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
