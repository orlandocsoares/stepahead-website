name: Deploy to VPS

on:
  push:
    branches:
      - main   # só faz deploy quando há push na branch main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Liga-se à VPS via SSH e faz o deploy
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: RESEND_API_KEY
          script: |
            set -e

            APP_DIR=/opt/apps/sabermais/sabermais.edu.ao

            echo "==> A ir para o directório da aplicação..."
            cd "$APP_DIR"

            echo "==> A actualizar variáveis de ambiente..."
            if grep -q '^RESEND_API_KEY=' "$APP_DIR/.env.production"; then
              sed -i "s|^RESEND_API_KEY=.*|RESEND_API_KEY=$RESEND_API_KEY|" "$APP_DIR/.env.production"
            else
              echo "RESEND_API_KEY=$RESEND_API_KEY" >> "$APP_DIR/.env.production"
            fi

            if grep -q '^APP_URL=' "$APP_DIR/.env.production"; then
              sed -i "s|^APP_URL=.*|APP_URL=https://sabermais.edu.ao|" "$APP_DIR/.env.production"
            else
              echo "APP_URL=https://sabermais.edu.ao" >> "$APP_DIR/.env.production"
            fi

            echo "==> A buscar o código mais recente..."
            git pull origin main

            echo "==> A aplicar migrações na base de dados..."
            DB_USER=$(grep '^POSTGRES_USER=' "$APP_DIR/.env.production" | cut -d'=' -f2 | tr -d '"')
            DB_NAME=$(grep '^POSTGRES_DB='   "$APP_DIR/.env.production" | cut -d'=' -f2 | tr -d '"')

            # Script de migração consolidado.
            # Contém todas as alterações de todos os ficheiros de workflow para garantir consistência.
            docker exec sabermais-postgres psql -U "$DB_USER" -d "$DB_NAME" -c "
              -- Adicionar colunas à tabela 'profiles'
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS last_name TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS provincia TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS escola TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS especialidade TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS biografia TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS avatar_url TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS formador_id UUID REFERENCES profiles(id) ON DELETE SET NULL;

              -- Criação de novas tabelas
              CREATE TABLE IF NOT EXISTS password_reset_tokens (
                token      TEXT PRIMARY KEY,
                user_id    UUID NOT NULL UNIQUE REFERENCES auth_users(id) ON DELETE CASCADE,
                expires_at TIMESTAMPTZ NOT NULL
              );

              CREATE TABLE IF NOT EXISTS email_confirm_tokens (
                token      TEXT PRIMARY KEY,
                user_id    UUID NOT NULL UNIQUE REFERENCES auth_users(id) ON DELETE CASCADE,
                expires_at TIMESTAMPTZ NOT NULL
              );

              CREATE TABLE IF NOT EXISTS mensagens (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                from_user_id UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                to_user_id   UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                content      TEXT NOT NULL,
                read         BOOLEAN NOT NULL DEFAULT FALSE,
                created_at   TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_mensagens_to   ON mensagens(to_user_id, read);
              CREATE INDEX IF NOT EXISTS idx_mensagens_conv ON mensagens(from_user_id, to_user_id, created_at DESC);

              CREATE TABLE IF NOT EXISTS notificacoes (
                id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                user_id    UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                tipo       TEXT NOT NULL,
                titulo     TEXT NOT NULL,
                mensagem   TEXT,
                lida       BOOLEAN NOT NULL DEFAULT FALSE,
                link       TEXT,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_notificacoes_user ON notificacoes(user_id, lida, created_at DESC);

              CREATE TABLE IF NOT EXISTS hero_telemetria (
                id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                media_radar INTEGER,
                updated_at TIMESTAMPTZ DEFAULT NOW()
              );
              INSERT INTO hero_telemetria (id) SELECT gen_random_uuid() WHERE NOT EXISTS (SELECT 1 FROM hero_telemetria);

              CREATE TABLE IF NOT EXISTS formando_formadores (
                id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                formando_id UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                formador_id UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                status      TEXT NOT NULL DEFAULT 'pendente',
                created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                ano_letivo  TEXT NOT NULL DEFAULT '2025/2026',
                UNIQUE(formando_id, formador_id, ano_letivo)
              );
              CREATE INDEX IF NOT EXISTS idx_ff_formando ON formando_formadores(formando_id, status);
              CREATE INDEX IF NOT EXISTS idx_ff_formador ON formando_formadores(formador_id, status);

              CREATE TABLE IF NOT EXISTS comunidade_comentarios (
                id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                post_id    UUID NOT NULL REFERENCES comunidade_posts(id) ON DELETE CASCADE,
                user_id    UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                content    TEXT NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_com_comentarios_post ON comunidade_comentarios(post_id, created_at ASC);
              CREATE TABLE IF NOT EXISTS ticket_mensagens (

                id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                ticket_id  UUID NOT NULL REFERENCES tickets(id) ON DELETE CASCADE,
                user_id    UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                content    TEXT NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_ticket_mensagens ON ticket_mensagens(ticket_id, created_at ASC);

              CREATE TABLE IF NOT EXISTS comunidade_gostos (
                post_id    UUID NOT NULL REFERENCES comunidade_posts(id) ON DELETE CASCADE,
                user_id    UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                PRIMARY KEY (post_id, user_id)
              );

              CREATE TABLE IF NOT EXISTS turmas (
                id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                nome        TEXT NOT NULL,
                area        TEXT NOT NULL,
                formador_id UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_turmas_formador ON turmas(formador_id);

              CREATE TABLE IF NOT EXISTS turma_membros (
                turma_id    UUID NOT NULL REFERENCES turmas(id) ON DELETE CASCADE,
                formando_id UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                PRIMARY KEY (turma_id, formando_id)
              );
              CREATE INDEX IF NOT EXISTS idx_turma_membros_formando ON turma_membros(formando_id);

              -- Alterações em tabelas existentes
              ALTER TABLE arquivos ADD COLUMN IF NOT EXISTS visibilidade TEXT NOT NULL DEFAULT 'publico';
              ALTER TABLE arquivos ADD COLUMN IF NOT EXISTS uploader_id UUID;
              ALTER TABLE arquivos ADD COLUMN IF NOT EXISTS turma_id UUID REFERENCES turmas(id) ON DELETE SET NULL;

              -- Atualizações de dados
              UPDATE profiles SET status = 'activo' WHERE role IN ('admin', 'super-admin');
              UPDATE arquivos SET visibilidade = 'publico';

              -- Disponibilidade agendada nos ficheiros
              ALTER TABLE arquivos ADD COLUMN IF NOT EXISTS disponivel_de  TIMESTAMPTZ;
              ALTER TABLE arquivos ADD COLUMN IF NOT EXISTS disponivel_ate TIMESTAMPTZ;

              -- Username para login sem email
              ALTER TABLE auth_users ADD COLUMN IF NOT EXISTS username TEXT UNIQUE;
              ALTER TABLE profiles   ALTER COLUMN email DROP NOT NULL;

              -- Tarefas
              CREATE TABLE IF NOT EXISTS tarefas (
                id          UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                titulo      TEXT        NOT NULL,
                descricao   TEXT,
                prazo       TIMESTAMPTZ,
                criador_id  UUID        NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_tarefas_criador ON tarefas(criador_id, created_at DESC);

              CREATE TABLE IF NOT EXISTS tarefa_destinatarios (
                tarefa_id   UUID NOT NULL REFERENCES tarefas(id) ON DELETE CASCADE,
                formando_id UUID NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                estado      TEXT NOT NULL DEFAULT 'pendente',
                entregue_at TIMESTAMPTZ,
                PRIMARY KEY (tarefa_id, formando_id)
              );
              CREATE INDEX IF NOT EXISTS idx_td_formando ON tarefa_destinatarios(formando_id, estado);

              -- Disciplinas e grupos de formação
              CREATE TABLE IF NOT EXISTS disciplinas (
                id       UUID    PRIMARY KEY DEFAULT gen_random_uuid(),
                nome     TEXT    NOT NULL UNIQUE,
                activo   BOOLEAN NOT NULL DEFAULT true,
                ordem    INT     NOT NULL DEFAULT 0
              );
              INSERT INTO disciplinas (nome, ordem) VALUES
                ('Educação Especial',    1),
                ('Educação Pré-Escolar', 2),
                ('Expressão Plástica',   3),
                ('Expressão Motora',     4),
                ('Língua Portuguesa',    5),
                ('Matemática',           6)
              ON CONFLICT (nome) DO NOTHING;

              CREATE TABLE IF NOT EXISTS grupos_formacao (
                id         UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                nome       TEXT        NOT NULL,
                activo     BOOLEAN     NOT NULL DEFAULT true,
                criado_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );

              ALTER TABLE arquivos ADD COLUMN IF NOT EXISTS grupo_formacao_id UUID REFERENCES grupos_formacao(id) ON DELETE SET NULL;
              ALTER TABLE arquivos ADD COLUMN IF NOT EXISTS disciplina_id UUID REFERENCES disciplinas(id) ON DELETE SET NULL;

              CREATE TABLE IF NOT EXISTS arquivo_grupos (
                arquivo_id UUID NOT NULL REFERENCES arquivos(id) ON DELETE CASCADE,
                grupo_id   UUID NOT NULL REFERENCES grupos_formacao(id) ON DELETE CASCADE,
                PRIMARY KEY (arquivo_id, grupo_id)
              );
              -- Migrar dados existentes da coluna simples para a tabela de junção
              INSERT INTO arquivo_grupos (arquivo_id, grupo_id)
                SELECT id, grupo_formacao_id FROM arquivos
                WHERE grupo_formacao_id IS NOT NULL
              ON CONFLICT DO NOTHING;

              -- Partilha no site público
              ALTER TABLE arquivos ADD COLUMN IF NOT EXISTS site_publico BOOLEAN NOT NULL DEFAULT false;

              -- Audit log (rastreio de todas as acções dos utilizadores)
              CREATE TABLE IF NOT EXISTS audit_logs (
                id         UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                action     TEXT        NOT NULL,
                actor_id   UUID        REFERENCES profiles(id) ON DELETE SET NULL,
                target_id  UUID        REFERENCES profiles(id) ON DELETE SET NULL,
                ip         TEXT,
                details    JSONB,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_audit_actor     ON audit_logs(actor_id, created_at DESC);
              CREATE INDEX IF NOT EXISTS idx_audit_action    ON audit_logs(action, created_at DESC);
              CREATE INDEX IF NOT EXISTS idx_audit_created   ON audit_logs(created_at DESC);

              -- Limpar sessoes expiradas
              DELETE FROM user_sessions WHERE expires_at < NOW();

              -- ===== Módulo Acções de Formação (substitui Turmas) =====

              -- Anos lectivos (referenciado antes mas nunca criado)
              CREATE TABLE IF NOT EXISTS anos_letivos (
                id         UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                ano_letivo TEXT        NOT NULL UNIQUE,
                activo     BOOLEAN     NOT NULL DEFAULT false,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              INSERT INTO anos_letivos (ano_letivo, activo) VALUES ('2025/2026', true)
                ON CONFLICT (ano_letivo) DO NOTHING;

              -- Formação: o curso/programa em abstracto
              CREATE TABLE IF NOT EXISTS formacoes (
                id          UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                nome        TEXT        NOT NULL,
                area        TEXT,
                descricao   TEXT,
                activo      BOOLEAN     NOT NULL DEFAULT true,
                created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );

              -- Acção de Formação: uma edição concreta de uma formação
              CREATE TABLE IF NOT EXISTS acoes_formacao (
                id            UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                formacao_id   UUID        REFERENCES formacoes(id) ON DELETE SET NULL,
                designacao    TEXT        NOT NULL,
                data_inicio   DATE,
                data_fim      DATE,
                horario       TEXT,
                local         TEXT,
                modalidade    TEXT        NOT NULL DEFAULT 'presencial',
                vagas_max     INTEGER,
                estado        TEXT        NOT NULL DEFAULT 'agendada',
                created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_acoes_formacao_formacao ON acoes_formacao(formacao_id);
              CREATE INDEX IF NOT EXISTS idx_acoes_formacao_estado   ON acoes_formacao(estado);

              -- Formadores associados a uma acção de formação (1 ou vários)
              CREATE TABLE IF NOT EXISTS acao_formadores (
                acao_formacao_id UUID        NOT NULL REFERENCES acoes_formacao(id) ON DELETE CASCADE,
                formador_id       UUID        NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                PRIMARY KEY (acao_formacao_id, formador_id)
              );
              CREATE INDEX IF NOT EXISTS idx_acao_formadores_formador ON acao_formadores(formador_id);

              -- Inscrições: formando inscrito numa acção de formação
              CREATE TABLE IF NOT EXISTS inscricoes_acao (
                id                UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                formando_id       UUID        NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
                acao_formacao_id  UUID        NOT NULL REFERENCES acoes_formacao(id) ON DELETE CASCADE,
                status            TEXT        NOT NULL DEFAULT 'inscrito',
                created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                UNIQUE(formando_id, acao_formacao_id)
              );
              CREATE INDEX IF NOT EXISTS idx_inscricoes_acao_formando ON inscricoes_acao(formando_id, status);
              CREATE INDEX IF NOT EXISTS idx_inscricoes_acao_acao     ON inscricoes_acao(acao_formacao_id, status);

              -- Ligação opcional de eventos de agenda a uma acção de formação
              ALTER TABLE agenda_atividades ADD COLUMN IF NOT EXISTS acao_formacao_id UUID REFERENCES acoes_formacao(id) ON DELETE SET NULL;

              -- Autor do evento — permite que formadores só eliminem os seus próprios eventos (admin elimina qualquer um)
              ALTER TABLE agenda_atividades ADD COLUMN IF NOT EXISTS criado_por UUID REFERENCES auth_users(id) ON DELETE SET NULL;

              -- Visibilidade de ficheiros passa a poder referenciar uma acção de formação
              ALTER TABLE arquivos ADD COLUMN IF NOT EXISTS acao_formacao_id UUID REFERENCES acoes_formacao(id) ON DELETE SET NULL;
              CREATE INDEX IF NOT EXISTS idx_arquivos_acao_formacao ON arquivos(acao_formacao_id);

              -- Ficha de inscrição: dados pessoais, académicos e profissionais adicionais
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS nome_pai TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS nome_mae TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS data_nascimento DATE;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS telemovel TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS naturalidade_provincia TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS naturalidade_municipio TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS municipio_residencia TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS habilitacoes_academicas TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS curso_concluido TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS agregacao_pedagogica BOOLEAN;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS municipio_escola TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS ciclo_ensino TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS anos_servico_docente INTEGER;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS disciplinas_lecciona TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS classes_lecciona TEXT;
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS cargos_pedagogicos TEXT;

              -- Obriga a troca de password no proximo login (contas criadas por staff com password temporaria)
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS must_change_password BOOLEAN NOT NULL DEFAULT false;

              -- Anexo opcional em mensagens privadas
              ALTER TABLE mensagens ADD COLUMN IF NOT EXISTS anexo_url TEXT;
              ALTER TABLE mensagens ADD COLUMN IF NOT EXISTS anexo_nome TEXT;
              ALTER TABLE mensagens ALTER COLUMN content DROP NOT NULL;

              -- Imagem/cartaz opcional para a acção de formação (espelhada no evento de agenda)
              ALTER TABLE acoes_formacao ADD COLUMN IF NOT EXISTS imagem_url TEXT;

              -- Área/disciplina da acção de formação — determina que ficheiros do repositório
              -- (área geral) ficam visíveis aos formandos inscritos nesta acção
              ALTER TABLE acoes_formacao ADD COLUMN IF NOT EXISTS area TEXT;

              -- Província (combo) da acção de formação
              ALTER TABLE acoes_formacao ADD COLUMN IF NOT EXISTS provincia TEXT;

              -- Repositório (nuvem de ficheiros por área) ligado a Acções de Formação: um ficheiro
              -- pode ser publicado em várias acções, cada uma com a sua própria janela de disponibilidade
              CREATE TABLE IF NOT EXISTS arquivo_acoes_formacao (
                id                UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                arquivo_id        UUID        NOT NULL REFERENCES arquivos(id) ON DELETE CASCADE,
                acao_formacao_id  UUID        NOT NULL REFERENCES acoes_formacao(id) ON DELETE CASCADE,
                disponivel_de     TIMESTAMPTZ,
                disponivel_ate    TIMESTAMPTZ,
                created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                UNIQUE(arquivo_id, acao_formacao_id)
              );
              CREATE INDEX IF NOT EXISTS idx_arq_acoes_arquivo ON arquivo_acoes_formacao(arquivo_id);
              CREATE INDEX IF NOT EXISTS idx_arq_acoes_acao     ON arquivo_acoes_formacao(acao_formacao_id);
              -- Divisão político-administrativa de Angola (Lei n.º 14/24): 21 províncias, 326 municípios
              CREATE TABLE IF NOT EXISTS provincias (
                id         UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                nome       TEXT        NOT NULL UNIQUE,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE TABLE IF NOT EXISTS municipios (
                id            UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                nome          TEXT        NOT NULL,
                provincia_id  UUID        NOT NULL REFERENCES provincias(id) ON DELETE CASCADE,
                created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                UNIQUE(nome, provincia_id)
              );
              CREATE INDEX IF NOT EXISTS idx_municipios_provincia ON municipios(provincia_id);
