              -- Ajuste manual de formandos anteriores ao sistema, somado às inscrições reais
              -- registadas em inscricoes_acao para compor o indicador público 'Formandos'
              ALTER TABLE hero_telemetria ADD COLUMN IF NOT EXISTS formandos_historico_ajuste INT NOT NULL DEFAULT 0;

              -- Interruptor para publicar (ou não) o indicador 'Formandos' no site público —
              -- fica desligado por omissão por sensibilidade com as entidades parceiras
              ALTER TABLE hero_telemetria ADD COLUMN IF NOT EXISTS mostrar_formandos_publico BOOLEAN NOT NULL DEFAULT false;

              -- Tipologia e público-alvo da acção, para a página pública 'Eventos'
              ALTER TABLE acoes_formacao ADD COLUMN IF NOT EXISTS tipologia TEXT;
              ALTER TABLE acoes_formacao ADD COLUMN IF NOT EXISTS publico_alvo TEXT;

              -- Nível de ensino em que o formando lecciona (Pré-Escolar/Primário/Secundário),
              -- pedido no registo — distinto de 'ciclo_ensino' (sub-ciclos do ensino secundário,
              -- usado na ficha profissional do formador)
              ALTER TABLE profiles ADD COLUMN IF NOT EXISTS nivel_ensino TEXT;

              -- Pastas para organizar documentos do Repositório por disciplina, sessão,
              -- Acção de Formação ou tema (pedido do cliente: parar de ter tudo solto)
              CREATE TABLE IF NOT EXISTS pastas (
                id                UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
                nome              TEXT        NOT NULL,
                area              TEXT        NOT NULL,
                acao_formacao_id  UUID        REFERENCES acoes_formacao(id) ON DELETE SET NULL,
                criado_por        UUID        REFERENCES profiles(id) ON DELETE SET NULL,
                created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_pastas_area ON pastas(area);

              -- Ficheiro pode viver dentro de uma pasta (fica solto/"Geral" se não tiver)
              ALTER TABLE arquivos ADD COLUMN IF NOT EXISTS pasta_id UUID REFERENCES pastas(id) ON DELETE SET NULL;
              CREATE INDEX IF NOT EXISTS idx_arquivos_pasta ON arquivos(pasta_id);

            " || echo "Aviso: migração já aplicada ou erro ignorado"

            # docker rm -f devolve o controlo antes do daemon terminar mesmo a remoção
            # (limpeza de rede/overlay continua em segundo plano); sem esperar por isso,
            # o "up --force-recreate" a seguir tenta recriar o mesmo nome enquanto essa
            # remoção ainda está em curso e falha com "removal ... is already in progress".
            wait_removed() {
              for i in $(seq 1 30); do
                docker inspect "$1" >/dev/null 2>&1 || return 0
                sleep 1
              done
              echo "Aviso: $1 ainda visível ao fim de 30s, a continuar mesmo assim"
            }

            echo "==> A construir e reiniciar o container web..."
            docker compose --env-file .env.production -f docker-compose.prod.yml build web
            docker rm -f sabermais-next 2>/dev/null || true
            wait_removed sabermais-next
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate --no-deps web

            echo "==> A recarregar o nginx (config + volumes)..."
            docker rm -f sabermais-nginx 2>/dev/null || true
            wait_removed sabermais-nginx
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate --no-deps nginx

            echo "==> A limpar imagens e cache antigas..."
            docker image prune -af
            docker builder prune -af
            docker system prune -f --volumes=false

            echo "✅ Deploy concluído!"
