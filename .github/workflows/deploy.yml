name: Deploy to VPS

on:
  push:
    branches:
      - main   # só faz deploy quando há push na branch main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Liga-se à VPS via SSH e faz o deploy
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            APP_DIR=/opt/apps/sabermais/sabermais.edu.ao

            # Se o directório não existir, clona o repo pela primeira vez
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "==> Primeira instalação: a clonar repositório..."
              mkdir -p "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            echo "==> A ir para o directório da aplicação..."
            cd "$APP_DIR"

            echo "==> A buscar o código mais recente..."
            git pull origin main

            echo "==> A construir e reiniciar os containers..."
            docker compose -f docker-compose.prod.yml build web
            docker compose -f docker-compose.prod.yml up -d --no-deps web

            echo "==> A limpar imagens antigas..."
            docker image prune -f

            echo "✅ Deploy concluído!"
